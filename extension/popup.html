<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Magpie Capture</title>
  <style>
    body { margin: 0; width: 280px; padding: 14px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; color: #111; }
    h1 { margin: 0 0 2px; font-size: 15px; }
    .tag { margin: 0 0 12px; color: #6b7280; font-size: 12px; }
    .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; flex: none; }
    .dot.ok { background: #10b981; } .dot.bad { background: #ef4444; }
    #status { font-size: 12px; color: #374151; }
    button { border: 0; border-radius: 8px; padding: 8px 12px; font: inherit; font-weight: 600; cursor: pointer; background: #111; color: #fff; width: 100%; }
    button.secondary { background: #f3f4f6; color: #111; font-weight: 500; }
    .hint { font-size: 12px; color: #6b7280; margin-top: 10px; }
    .toggle { margin-top: 12px; align-items: flex-start; font-size: 12px; color: #374151; cursor: pointer; }
    .toggle input { margin: 2px 0 0; flex: none; }
    kbd { font: 11px/1 ui-monospace, Menlo, monospace; padding: 2px 5px; border: 1px solid #d1d5db; border-bottom-width: 2px; border-radius: 4px; background: #f9fafb; }
    a { color: #2563eb; cursor: pointer; text-decoration: none; }
    details { margin-top: 12px; font-size: 12px; color: #6b7280; }
    details input { width: 100%; box-sizing: border-box; margin: 6px 0; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Magpie</h1>
  <p class="tag">Collect inspiration. Create with it.</p>

  <div class="row"><span id="dot" class="dot"></span><span id="status">正在连接 Core…</span></div>

  <div class="row"><button id="capture">在当前页面收集</button></div>
  <div class="row"><button id="open" class="secondary">打开素材库（Dev UI）</button></div>

  <label class="row toggle"><input id="hoverMenu" type="checkbox"><span>悬停收集：鼠标停在图片上出现 Magpie 按钮，选中文字后出现保存条</span></label>

  <p class="hint">快捷键 <kbd id="shortcut">…</kbd> · 有选中文字收文字，否则点选图片。<a id="shortcuts">修改快捷键</a></p>

  <details>
    <summary>Core 地址</summary>
    <input id="coreUrl" type="url" placeholder="http://127.0.0.1:8765" spellcheck="false">
    <button id="saveUrl" class="secondary">保存并重连</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
